name: Spice-roasted Celeriac
serves: 6
ingredients:
    celeriac: 1 kg
    olive_oil: 45ml
    cumin_seed: 6g
    coriander_seed: 6g
    honey_clear: 3 tbsp
    orange: 1
    pul_biber_chilli_flake: 2 tsp
method: |
    1. Preheat the oven to 220C
    2. Cut the celeriac into 2.5cm chunks, place in a roasting tin and drizzle with oil. Add the cumin and coriander seeds and a generous amount of salt and pepper, then rub the oil and spices all over the celeriac. Roast for 30 minutes until the edges are nicely browned.
    3. Mix the honey, orange zest and juice and chilli flakes in a small bowl.
    4. Remove the celeriac from the oven, drizzle over the glaze and turn the chunks in the mixture until well coated, then roast again for 10 more minutes.