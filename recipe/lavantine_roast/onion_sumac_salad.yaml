name: Onion and Sumac Salad
serves: 6
ingredients:
    red_onion: 2
    parsley: 100g
    lemon_juice: 2 tbsp
    sumac: 1.5 tsp
    salt: 1.5g
method: |
    1. Slice the onion and chop the parsley. Toss together with the freshly squeezed lemon juice, sumac powder and salt. Set aside in the refrigerator and chill for at least 20 minutes before serving.