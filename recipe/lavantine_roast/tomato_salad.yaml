name: Tomato Salad
serves: 4
ingredients:
    cherry_tomato: 400 g
    shallot: 2
    olives: 50 g
    pomegranate: 0.5
    mint: 100g
    coriander: 100g
    pisachio_nut: 30g    
    olive_oil: 2 tbsp
    date_molasses: 1 tbsp
    red_wine_vinegar: 1 tbsp
method: |
    1. Halve the tomatoes. Thinly slice the shallots. Remove the seeds from the pomegranate. Chop the herbs and nuts.
    2. Put all the ingredients into a bowl, season generously with salt and pepper and toss.
    3. Make the dressing by whisking the oil, date molasses and vinegar together. Pour over the salad just before serving.