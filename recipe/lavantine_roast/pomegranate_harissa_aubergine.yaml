name: Pomegranate and Harissa Roasted Aubergines
serves: 4
ingredients:
    aubergine: 2
    garlic_oil: 3 tbsp
    rose_harissa: 2 tbsp
    pomegranate_molasses: 2 tbsp
    honey_clear: 2 tbsp
method: |
    1. Preheat the oven to 220C
    2. Peel the aubergines and cut them in half lengthways. Score criss-cross lines about 1.5cm apart in the flat side of each half, cutting no deeper than 1cm into the flesh.
    3. Place the aubergine halves, cut-side up, in a roasting tin, brush generously with garlic oil and roast for 30 minutes.
    4. Mix the harissa, molasses, honey and a generous amount of salt in a small bowl. Remove the aubergine from the over and spoon the harissa mixture evenly over the aubergine to coat generously, then roast for another 10 minutes. Serve immediately.