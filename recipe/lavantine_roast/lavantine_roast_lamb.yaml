name: Lavantine Roast Lamb
serves: 6
ingredients:
    lamb_leg_bone_in: 2kg
    garlic: 5 clove
    salt: 17g
    pepper: 17g
    allspice_ground: 1 tbsp
    cinnamon_ground: 1.5 tsp
    nutmeg_ground: 0.5 tsp
    cloves_ground: 0.5 tsp
    cardamom_ground: 0.5 tsp
    sumac: 1.5 tbsp
    olive_oil: 250 ml
    red_wine_vinegar: 80 ml
    lemon_juice: 125 ml
    onion: 3
    khebez_arabi: 6
    red_pepper: 3
    parsley: 100g
    mint: 100g
    pomegranate: 1
    pomegranate_molasses: 100 ml
    greek_yoghurt: 250 g
method: |
    1. The day before, combine all the seasonings and spices (except the garlic) in a large mixing bowl, making sure they are well blended. Whisk in the olive oil, vinegar, and lemon juice and set aside.
    2. Place the lamb into a large mixing bowl and, using a small, sharp knife, make 1-inch-deep slits all over and into the surface of the meat. Insert the garlic cloves into the slits, then pour the liquid marinade over the meat and thoroughly rub into the meat.
    3. Tightly cover the roast with plastic wrap and place in the refrigerator to marinate overnight.
    4. The next day, remove the lamb from the refrigerator and let the lamb come to room temperature before roasting. Preheat the oven to 220C.
    5. Bring 750 ml of water to a boil in a small pot, turn off the heat, and cover. Quarter the onions and place on the bottom of a large roasting pan, and pour the hot water over them. Remove the lamb from the marinade, discard the liquid, and place lamb on top of a roasting rack set into the roasting pan. Roast the lamb in the centre of the oven for 30 minutes.
    6. Lower the temperature to 180C and roast for 1.5 hours more, periodically basting the lamb with the juices it releases. You may need to add more hot water if the natural juices are evaporating.
    7. Roast or grill the red peppers with oil and salt. Peel and cut into thin strips.
    8. At the end of the roasting time, check the lamb. The skin should be dark and the meat should be very fragrant. Remove the pan from the oven, and transfer the lamb to a large wooden carving board, cover it completely with aluminium foil, and allow it to rest for 10 minutes before carving. Turn off the oven. Strain the pan juices and reserve to use as a sauce if you like.
    9. Arrange the Khebez Arabi breads or pita pockets on a large baking sheet, layering and overlapping them slightly. Place in the still warm (but turned off) oven for 2 to 3 minutes, flipping them over halfway so they are warmed through.
    10. Chop the herbs. Remove the seeds from the pomegranate.
    11. Once the lamb has finished resting, thinly slice the lamb against the grain and off the bone, using a very sharp carving knife and a carving fork. Pile the lamb in the warm bread, adding the red peppers and other toppings to taste.