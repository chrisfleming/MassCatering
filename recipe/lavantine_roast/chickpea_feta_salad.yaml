name: Chickpea and Feta Salad
serves: 4
ingredients:
    chickpea: 1 can
    pomegranate: 0.5
    mint: 100g
    basil: 100g
    spring_onion: 4
    feta_cheese: 100 g
    olive_oil: 2 tbsp
    lemon: 0.5
    honey_clear: 1 tsp
    cumin_ground: 0.5 tsp
    cinnamon_ground: 0.5 tsp
method: |
    1. Remove the seeds from the pomegranate. Chop the herbs and onions thinly. Crumble the feta.
    2. Put all the ingredients into a bowl and toss.
    3. Make the dressing by whisking the oil, lemon, honey and spices. Season generously with salt and pepper. Serve at room temperature.