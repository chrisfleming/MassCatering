name: Tahini Potatoes
serves: 6
ingredients:
    potato: 750 g
    butter_salted: 125 g
    tahini: 6 tbsp
    spring_onion: 8
method: |
    1. Cook the potatoes in boiling water for 20-25 minutes until tender.
    2. Drain the potatoes and return to the pan. Add the butter, tahini and a generous amount of salt and pepper. Lightly crush the potatoes and then mix to ensure that butter and tahini are evenly combined. Stir in the thinly sliced spring onions.