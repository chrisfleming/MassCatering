name: Vegan Fish Pie
serves: 4

ingredients:
  butter_bean: 800 g

  vegan_butter: 70 g
  onion: 2
  garlic: 3 clove
  leek: 2

  dill: 1 tbsp
  parsley: 1 tbsp

  oat_cream: 250 ml
  white_wine: 100 ml

  nori_sheet: 1
  capers: 2 tsp
  nutritional_yeast: 3 tbsp

  peas: 150 g

  potato: 1000 g
  oat_milk: 60 ml

method: |
  Peel and chop the potatoes. Boil until tender,
  around 10-15 minutes.

  Drain and mash with vegan butter and oat milk.
  Season with salt and pepper and set aside.

  Lightly mash the butter beans so that some remain intact.

  Melt the vegan butter in a large pan.
  Add the onion and cook until translucent.

  Add the garlic and cook for 2 minutes.

  Add the leeks and cook until softened.

  Stir through the dill and parsley.

  Add the oat cream and white wine and bring to a gentle simmer.

  Stir through the chopped nori, capers and nutritional yeast.

  Add the butter beans and peas and heat through.

  Transfer the filling to a baking dish.

  Top evenly with the mashed potato and rough the surface with a fork.

  Bake at 190 C for 20-30 minutes until golden and bubbling.

notes: |
  The nori, capers and nutritional yeast provide the traditional
  fish-pie flavour profile. Water can be substituted for white wine.
  Sweet potato can be used for the topping.

source: Vegan Punks Vegan Fish Pie