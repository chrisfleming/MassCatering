name: Jerk Butternut Squash
serves: 4
ingredients:
    butternut_squash: 1
    ginger: 30 g
    spring_onion: 1
    onion: 0.25
    pimento_whole: 1 tsp
    cinnamon_ground: 0.25 tsp
    nutmeg_ground: 0.25 tsp
    salt: 1 tsp
    sugar: 1 tsp
    garlic: 2 clove
    thyme: 3 sprig
    cider_vinegar: 1 tbsp
    black_peppercorns_whole: 1 tsp
    chilli_scotch_bonnet: 0.5
method: |
    1. Blend all the ingredients (except the squash) to a fine paste.
    2. Quarter the squash lengthways. Make deep slashes at 2.5cm intervals. Pour the marinade over, pushing it into all the slits.
    3. Preheat the over to 180 / fan 160 / gas 4. Place the squash on a tray and cook for 1 hour.