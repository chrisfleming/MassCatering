name: Jerk Chicken
serves: 6
ingredients:
    chicken_leg: 8
    ginger: 60 g
    spring_onion: 4
    onion: 1
    pimento_whole: 2 tbsp
    salt: 2 tsp
    sugar: 2 tbsp
    garlic: 6 clove
    thyme: 15 sprig
    cider_vinegar: 4 tbsp
    black_peppercorns_whole: 1 tbsp
    chilli_scotch_bonnet: 1
method: |
    1. Blend all the ingredients (except the chicken) to a fine paste. Slash the chicken and rub the marinade all over. Cover and refrigerate for 24 hours.
    2. Preheat the over to 180 / fan 160 / gas 4. Place the chicken on a tray and cook for 30 minutes. Check the pieces are cooked then finish under a grill for 6 minutes to brown the skin.