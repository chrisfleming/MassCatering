name: Peanut and Sweet Potato Stew
serves: 4
ingredients:
    oil: 2 tbsp
    onion: 1
    garlic: 2 clove
    ginger: 30 g
    turmeric: 2 tsp
    cumin_ground: 1 tbsp
    coriander_ground: 1 tbsp
    fenugreek_ground: 1 tsp
    sweet_potato: 2
    vegetable_stock: 400 ml
    kidney_beans: 1 can
    peanut_butter: 2 tbsp
    spinach: 2 bunch
method: |
    1. Fry the onion for 8 minutes. Add the garlic and ginger and cook for another few minutes. Add the spices and a little water for a minute or two.
    2. Add the cubed sweet potatoes and stir to coat. Pour in the stock, beans and peanut butter. Cover and cook for 10-15 minutes until the sweet potatoes are soft.
    3. Remove the lid, mix in the spinach and leave for 5 minutes until cooked through. Season to taste.