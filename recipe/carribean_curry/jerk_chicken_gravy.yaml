name: Jerk Chicken Gravy
serves: 6
ingredients:
    jerk_marinade_leftover: 2 tbsp
    butter: 50 g
    flour_plain: 50 g
    chicken_stock: 750 ml
    ketchup: 45g
    honey: 5g
    salt: 3g
method: |
    1. Fry the jerk marinade in the butter for 5 minutes. Add the flour and mix well. Gradually add the stock.
    2. Add the ketchup and cook until the gravy thickens. Add honey and salt to taste.