name: Smoky Aubergine Rundown
serves: 4
ingredients:
    aubergine: 4
    oil: 2 tbsp
    onion: 1
    garlic: 3 clove
    ginger: 30 g
    pepper_red: 1
    pumpkin: 200 g
    tomato: 2
    thyme: 3 sprig
    pimento_ground: 0.5 tsp
    cumin_ground: 0.5 tsp
    coconut_milk: 400 ml
    bay_leaf: 2
method: |
    1. Grill the aubergines over a flame or grill until they start to smoke. Place in a lidded container and peel once cool enough.
    2. Fry the onion for five minutes. Add the garlic, ginger, sliced red pepper, pumpkin, tomatoes and thyme and cook for another five minutes.
    2. Stir in the spices for a few minutes. Add the coconut milk, bay leaves and a splash of water to loosen. Cover and cook for 15-20 minutes until the pumpkin has softened.
    3. Remove the lid, stir in the chunked aubergines and cook for another 8 minutes until the sauce has thickened.