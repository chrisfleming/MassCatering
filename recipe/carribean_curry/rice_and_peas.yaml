name: Rice and Peas
serves: 6
ingredients:
    gungo_peas_or_kidney_beans: 1 can
    spring_onion: 3
    garlic: 1 clove
    thyme: 3 sprig
    oil: 2 tbsp
    rice_long_grain: 300 g
    coconut_milk: 200 ml
    bean_liquid: 100 ml
method: |
    1. Rinse the rice and then soak for 30 minutes.
    2. Fry the spring onions (finely chopped), garlic and thyme for 5 minutes.
    3. Add the drained peas/beans (reserve the liquid) and the rice and stir to coat. Add the cononut milk, bean liquid and a pinch of salt.
    4. Bring to the boil, cover and cook for 15 minutes. Fluff up, turn off the heat and steam for 10 minutes more.