name: Curry Goat
serves: 6
ingredients:
    goat: 1500 g
    garlic: 3 clove
    curry_powder_jamaican: 3 tbsp
    all_purpose_seasoning: 1 tbsp
    salt: 1 tsp
    pepper: 1 tsp
    oil: 3 tbsp
    thyme: 3 sprig
    pimento_ground: 1 tsp
    water: 400 ml
    chilli_scotch_bonnet: 1
    potato: 2
method: |
    1. Mix goat meat with garlic, onions (chopped), curry powder, all-purpose seasoning, salt and pepper. Cover and leave for 2 hours in the fridge.
    2. Scrape the marinade from the meat and keep separate. Fry the meat to seal all over (about 10 minutes).
    3. Add the marinade to the pan with the thyme, pimento and some more oil if needed. Cook under the onions start to soften. Pour in the water, bring to the boil.
    4. Pierce the chilli with a knife, add to the pan and cover. Simmer for 1.5 hours until the meat is tender and the fat has separated.
    5. Remove the thyme and chilli. Add the potatoes and cook until they are tender (15 mins).