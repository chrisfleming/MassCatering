name: Jerk Vegan Gravy
serves: 4
ingredients:
    onion: 0.5
    spring onion: 2
    ginger: 40 g
    garlic: 2 clove
    pimento_ground: 1 tsp
    pepper: 1 tsp
    sugar: 1 tsp
    thyme: 2 sprig
    oil: 2 tbsp
    vegetable_stock: 500 ml
    ketchup: 4 tbsp
    soy_sauce: 1 tsp
    cornflour: 1 tbsp
method: |
    1. Blend the onion, spring onion, ginger, garlic, pimento, pepper, sugar and thyme to a paste. Fry for four minutes.
    2. Add the ketchup, stock and soy sauce and cook for 15 minutes.
    3. Mix the cornflour with a splash of water, stirring to form a loose pste. Stir into the gravy and cook until it starts to thicken. Salt to taste.