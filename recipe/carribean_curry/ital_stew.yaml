name: Ital Stew
serves: 4
ingredients:
    oil: 2 tbsp
    onion: 1
    garlic: 3 clove
    ginger: 30 g
    spring onion: 3
    thyme: 3 sprig
    pepper_red: 1
    turmeric: 1 tsp
    coconut_milk: 400 ml
    water: 200 ml
    potato: 1
    sweetcorn_cob: 2
    pumpkin: 150 g
    chocho_or_courgette: 1
    sweet_potato: 1
    spinach: 2 bunch
method: |
    1. Fry the onion for five minutes. Add the garlic, ginger, spring onion, thyme and red pepper and cook for another five minutes.
    2. Stir in the turmeric, coconut milk, water, potato, corn and pumpkin. Cook for another 10 minutes.
    3. Add the other veg except the spinach and simmer for 10 minutes. Add the spinach and simmer for a final 10 minutes. Pick out the thyme and salt to taste.