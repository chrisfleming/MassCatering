name: Apple Coleslaw
serves: 6
ingredients:
    cabbage_white: 0.5
    cabbage_red: 0.25
    onion_red: 1
    carrot: 1
    apple: 2
    lemon: 0.5
    salt: 5g
    mayonnaise: 45g
    yoghurt_plain: 2 tbsp
    cider_vinegar: 2 tbsp
method: |
    1. Shred the cabbage and finely matchstick the onion, carrot and apple.
    2. Mix the mayonnaise, yogurt and vinegar together in a separate bowl.
    3. Combine the vegetables with the dressing and the lemon juice. Add the salt just before serving.