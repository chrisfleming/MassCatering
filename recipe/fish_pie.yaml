name: Fish Pie
serves: 6

ingredients:
  salmon: 400 g
  white_fish: 300 g
  smoked_haddock: 150 g
  prawns: 150 g

  onion: 1
  milk: 600 ml
  butter: 75 g
  plain_flour: 25 g
  dijon_mustard: 1 tsp
  parsley: 2 tbsp
  lemon_juice: 1 tbsp

  potato: 1000 g
  cheddar: 50 g

method: |
  Peel and chop the potatoes. Boil in salted water for 15-18 minutes
  until tender. Drain and mash with 50 g butter, warm milk,
  salt and pepper. Set aside.

  Place the salmon, white fish and smoked haddock into a pan with
  500 ml milk. Simmer gently for 5-6 minutes until just cooked.
  Remove the fish, reserve the milk and flake the fish into large pieces.
  Add the prawns.

  Melt 25 g butter in a saucepan and cook the onion until softened.
  Stir in the flour and cook for 1 minute.

  Gradually whisk in the reserved milk until a thick smooth sauce forms.

  Stir in the Dijon mustard, parsley and lemon juice.
  Season with salt and pepper.

  Combine the fish mixture and sauce in a large baking dish.

  Spread the mashed potato evenly over the top.
  Sprinkle with grated cheddar if using and rough the surface with a fork.

  Bake at 200 C for 25-30 minutes until golden brown and bubbling.

notes: |
  Luxury fish pie inspired by traditional British fish pie recipes.
  Can be assembled in advance and baked before serving.

source: Mary Berry Luxury Fish Pie