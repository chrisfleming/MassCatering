name: Game Stew
serves: 6
ingredients:
    butter: 25 g
    bacon_smoked_streaky: 100 g
    onion_small: 8
    thyme: 2 sprig
    bay_leaf: 1
    juniper_berry: 6
    game: 1 kg
    flour: 2 tbsp
    wine_red: 200 ml
    chicken_stock: 400 ml
    redcurrant_jelly: 75 g
    carrot: 2
    mushroom: 150 g
    root_veg: 2 kg
    potato: 2 kg
    butter: 50 g
method: |
    1. Heat the oven to 150C or gas 2. Heat the butter in a casserole dish over a medium-high flame, then fry the rolled up bacon, turning regularly, until golden and the fat renders out. Lift out and set aside.
    2. Put the onions (kept whole), with the thyme, bay and juniper berries, in the pot and fry until golden, then lift out and set aside in a separate dish.
    3. Dust the meat with flour and a pinch of salt and pepper. Fry in batches, being careful not to overcrowd the pan, adding more butter (or oil) if necessary, until well browned on all sides. Lift out and set aside with the onions.
    4. Add the wine to the pan and scrape the bottom, then add the stock and stir in the redcurrant jelly to dissolve it. Bring to a simmer, then return the onions, herbs and game to the pot. Cover and put in the oven for 45 minutes, then stir in the carrots and mushrooms, and return to the oven, covered, for 15 minutes. Arrange the bacon on top, leave the lid ajar and bake for another 30 minutes.
    5. Roast the root veg (or boil if you prefer) under tender.
    6. Boil the potatoes until soft. Mash the potatoes with butter.
    7. Test the meat – it should be tender – season to taste and serve with root veg and mash.