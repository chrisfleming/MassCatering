name: Vegan Roast Wellington
serves: 4
url: https://desertislanddishes.co/nut-roast-wellington/#h-ingredients
ingredients:
    onion: 1
    celery_stick: 1 
    mushroom: 350g
    vegetable_oil: 30ml
    marmite: 15g
    chestnuts_cooked: 100g
    chopped_nuts: 175g
    garlic: 3 clove
    bay_leaf: 2
    thyme: 5 sprigs
    rosemary: 3 sprig
    tomato_puree: 1 tbsp
    veg_stock_cube: 1
    puff_pastry_vegan: 320g
    mustard: 10g
    oat_milk: 10ml
    sage: 1tbsp
    potato: 175g
    cabbage: 0.16
    carrot: 125g
    parsnip: 75g

method: |
    0. Potato, cabbage, carrot and parsnip for roasting separately
    1. Preheat the oven to 220 C/200 Fan. Line a large baking sheet with non-stick baking paper.
    2. Put the oil in a large non-stick frying pan, followed by the onion, celery and mushrooms. Sauté for about 10 minutes over a medium heat, stirring often, until softened. 
    3. Meanwhile, blitz the chestnuts and nuts in a blender.
    4. Add the garlic, chopped herbs and bay leaves to the softened vegetables and continue to cook over a low-medium heat for about 5-10 minutes, stirring often. 
    5. Add the tomato purée, marmite, then crumble over the vegetable stock cube.
    6. Add the blitzed chestnuts and nuts along with the remaining butter and stir well. Season to taste, remove from the heat and allow to cool slightly.
    7. Unroll the pastry and cut a strip from the end to make the decorations. 
    8. Tip the cooled vegetable-chestnut mixture on top and shape into a long sausage. Brush the edges with the mustard, fold over and encase the mix. Use a fork to seal the edges. Place onto the prepared baking sheet.
    9. Cut out little pastry stars with the reserved strip of pastry. Use a little of the oat milk to stick them on top. 
    10. Brush with the remaining oat milk and bake for around 20-25 minutes – or until the pastry is puffed up, golden and crisp.  
    11. Leave to stand for 5 minutes before slicing.